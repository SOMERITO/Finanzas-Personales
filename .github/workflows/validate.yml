name: Validate CFO Pro
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in app-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
